<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    body{
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 0px;
      margin: 0px;
    }
    .container {
      background-color: #000;
      height: 748px;
      width: 748px;
      display: grid;
      grid-template-columns: 320px 1fr 50px;
      grid-template-rows: 414px 1fr 22px;
      gap: 9px;

    }

    .red {
      background-color: #E72F24;
      
    }

    .Blue {
      background-color: #004592;
      height: 120px;
      
    }

    .Yellow{
      background-color: #F9D01E;
      width: 198px;
      
    }

    .Black{
      background-color: #232629;
      width: 153px;
      

    }

    .five{
      grid-row: span 2;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .small {
      background-color: #F0F1EC;
      
      display: flex;

    }
    .items{
      
      display: flex;
    }

    .two {
      grid-column: span 2;
    }

    .White {
      background-color: #F0F1EC;
    }

    .underwhite {
      height: 185px;
      background-color: #F0F1EC;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->

  <div class="container">
    <div class="items red"></div>
    <div class="items two White"></div>
    <div class="items White"></div>
    <div class="items White"></div>
    <div class="five ">
      <div class="Blue"></div>
      <div class="underwhite"></div>
    </div>
    <div class="items White small"></div>
    <div class="items ">
      <div class="Yellow"></div>
      <div class="Black"></div>
    </div>
  </div>
</body>

</html>
